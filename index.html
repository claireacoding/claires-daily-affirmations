<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Three grounded affirmations for today: money, health, and self. Same day, same three lines."
    />
    <title>Today — Daily Affirmations</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#daily">Skip to today’s affirmations</a>

    <div class="page">
      <header class="site-header">
        <p class="wordmark">Today</p>
        <p class="tagline">Three lines for the day</p>
        <p class="date" id="date-label"></p>
      </header>

      <main id="daily" class="daily">
        <h1 class="sr-only">Today’s affirmations</h1>
        <div id="cards" class="cards"></div>
        <p class="sr-only" id="save-status" aria-live="polite"></p>
      </main>

      <section class="favorites-wrap" aria-labelledby="favorites-heading">
        <details class="favorites" id="favorites">
          <summary>
            <span id="favorites-heading">Favorites</span>
            <span class="fav-count" id="fav-count" aria-hidden="true">0</span>
          </summary>
          <p class="favorites-hint" id="favorites-empty">
            Nothing saved yet. Tap a heart if a line lands.
          </p>
          <ul class="favorites-list" id="favorites-list"></ul>
        </details>
      </section>

      <footer class="site-footer">
        <p>These three stay the same until the calendar day changes.</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
